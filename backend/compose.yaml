# Local development only. Port is bound to loopback; production needs authentication/TLS.
services:
  mongo:
    image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - palette-mongo:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)']
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s
  mongo-init:
    image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/initReplicaSet.mongosh:/initReplicaSet.mongosh:ro
    command:
      [
        'mongosh',
        'mongodb://mongo:27017/?directConnection=true',
        '--quiet',
        '--file',
        '/initReplicaSet.mongosh',
      ]
    restart: 'no'
  backend:
    profiles: [api]
    build:
      context: .
    image: palette-backend:local
    env_file:
      - path: ${BACKEND_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: development
      PORT: '3001'
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
volumes:
  palette-mongo:
