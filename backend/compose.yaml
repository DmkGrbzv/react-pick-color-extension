# Local development only. Port is bound to loopback; production needs authentication/TLS.
services:
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - palette-mongo:/data/db
volumes:
  palette-mongo:
