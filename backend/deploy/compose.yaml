# Backend-only staging delivery. The persistent TLS MongoDB deployment is managed separately.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set the verified backend image digest}
    pull_policy: never
    env_file: ${STAGING_ENV_FILE:?Set the absolute staging configuration path}
    environment:
      NODE_ENV: production
      PORT: '3001'
    ports:
      - '127.0.0.1:${STAGING_API_PORT:-3001}:3001'
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
