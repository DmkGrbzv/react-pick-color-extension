name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.3'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      attempt: ${{ steps.context.outputs.attempt }}
      install: ${{ steps.install.conclusion }}
      lint: ${{ steps.lint.conclusion }}
      tests: ${{ steps.tests.conclusion }}
      build: ${{ steps.build.conclusion }}
      verify: ${{ steps.verify.conclusion }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - name: Record check attempt
        id: context
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        id: install
        run: node scripts/ci/runCheck.js frontend install

      # The existing lint command checks frontend and backend source files.
      - name: Lint repository
        id: lint
        run: node scripts/ci/runCheck.js frontend lint

      - name: Test frontend
        id: tests
        run: node scripts/ci/runCheck.js frontend tests

      - name: Build extension
        id: build
        run: node scripts/ci/runCheck.js frontend build

      - name: Verify extension build
        id: verify
        run: node scripts/ci/runCheck.js frontend verify

      - name: Save sanitized frontend diagnostics
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-checks-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/frontend/install.json
            .ci-reports/frontend/lint.json
            .ci-reports/frontend/tests.json
            .ci-reports/frontend/build.json
            .ci-reports/frontend/verify.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: ci-mongo-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      attempt: ${{ steps.context.outputs.attempt }}
      install: ${{ steps.install.conclusion }}
      tests: ${{ steps.tests.conclusion }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
      mongo: ${{ steps.mongo.conclusion }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Record check attempt
        id: context
        working-directory: ${{ github.workspace }}
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        id: install
        run: node ../scripts/ci/runCheck.js backend install

      # Unit/HTTP/OIDC tests use memory repositories and mocked provider responses.
      - name: Test backend
        id: tests
        run: node ../scripts/ci/runCheck.js backend tests

      - name: Start isolated MongoDB replica set
        id: mongo_start
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d mongo
          docker compose -f compose.yaml -f compose.ci.yaml run --rm mongo-init
          docker compose -f compose.yaml -f compose.ci.yaml exec -T mongo mongosh --quiet --eval 'if (db.serverStatus().tcmalloc.usingPerCPUCaches !== false) quit(1)'

      - name: Test MongoDB transactions and repository contracts
        id: mongo
        run: node ../scripts/ci/runCheck.js backend mongo
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true

      - name: Save isolated MongoDB diagnostics
        if: ${{ always() && steps.mongo_start.outcome != 'skipped' }}
        run: |
          mkdir -p ../.ci-reports/backend
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail 100 mongo > ../.ci-reports/backend/mongo-service.log 2>&1 || true

      - name: Remove temporary MongoDB environment
        if: ${{ always() && steps.mongo_start.outcome != 'skipped' }}
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans

      - name: Save sanitized backend diagnostics
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-checks-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/backend/install.json
            .ci-reports/backend/tests.json
            .ci-reports/backend/mongo.json
            .ci-reports/backend/mongo-service.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      attempt: ${{ steps.context.outputs.attempt }}
      build: ${{ steps.build.conclusion }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - name: Record check attempt
        id: context
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Build backend Docker image
        id: build
        run: node scripts/ci/runCheck.js image build
        env:
          REVISION: ${{ github.sha }}
      - name: Export the checked image
        run: docker save palette-backend:ci --output .ci-reports/image/backend.tar
      - name: Save checked image for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/image/backend.tar
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
      - name: Save sanitized image diagnostics
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-checks-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/image/build.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish backend image
    needs: [frontend, backend, image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-backend-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Download checked image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-image-${{ github.run_id }}-*
          path: .ci-reports/checked-images
      - name: Load the exact image that passed the build check
        run: |
          archive=".ci-reports/checked-images/backend-image-${GITHUB_RUN_ID}-${CHECK_ATTEMPT}/backend.tar"
          docker load --input "$archive"
        env:
          CHECK_ATTEMPT: ${{ needs.image.outputs.attempt }}
      - name: Publish full-SHA tag without rebuilding or overwriting
        run: node scripts/ci/publishImage.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save published digest
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/publication/image.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Google Docs report
    needs: [frontend, backend, image]
    if: ${{ always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: google-doc-report-${{ github.repository_id }}-${{ vars.GOOGLE_DOC_ID }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download sanitized check diagnostics
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # All attempts of this run allow a reporting-only retry to reuse checks.
          pattern: ci-checks-*-${{ github.run_id }}-*
          path: .ci-reports/downloads

      - name: Prepare complete sanitized report
        run: node scripts/ci/report.js
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}

      # Persist the full prepared report before any Google authentication/write.
      - name: Save prepared report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/report/report.json
            .ci-reports/report/report.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Authenticate reporting service account through WIF
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_REPORT_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/documents
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Replace and verify Google document report
        run: node scripts/ci/googleDocReport.js
        env:
          GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}

      - name: Save delivery outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/delivery/status.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
