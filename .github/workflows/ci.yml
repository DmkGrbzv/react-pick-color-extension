name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.3'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      attempt: ${{ steps.context.outputs.attempt }}
      install: ${{ steps.install.conclusion }}
      lint: ${{ steps.lint.conclusion }}
      tests: ${{ steps.tests.conclusion }}
      build: ${{ steps.build.conclusion }}
      verify: ${{ steps.verify.conclusion }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - name: Record check attempt
        id: context
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        id: install
        run: node scripts/ci/runCheck.js frontend install

      # The existing lint command checks frontend and backend source files.
      - name: Lint repository
        id: lint
        run: node scripts/ci/runCheck.js frontend lint

      - name: Test frontend
        id: tests
        run: node scripts/ci/runCheck.js frontend tests

      - name: Build extension
        id: build
        run: node scripts/ci/runCheck.js frontend build

      - name: Verify extension build
        id: verify
        run: node scripts/ci/runCheck.js frontend verify

      - name: Save sanitized frontend diagnostics
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-checks-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/frontend/install.json
            .ci-reports/frontend/lint.json
            .ci-reports/frontend/tests.json
            .ci-reports/frontend/build.json
            .ci-reports/frontend/verify.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      attempt: ${{ steps.context.outputs.attempt }}
      install: ${{ steps.install.conclusion }}
      tests: ${{ steps.tests.conclusion }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Record check attempt
        id: context
        working-directory: ${{ github.workspace }}
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        id: install
        run: node ../scripts/ci/runCheck.js backend install

      # Unit/HTTP/OIDC tests use memory repositories and mocked provider responses.
      - name: Test backend
        id: tests
        run: node ../scripts/ci/runCheck.js backend tests

      - name: Save sanitized backend diagnostics
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-checks-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/backend/install.json
            .ci-reports/backend/tests.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Google Docs report
    needs: [frontend, backend]
    if: ${{ always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: google-doc-report-${{ github.repository_id }}-${{ vars.GOOGLE_DOC_ID }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download sanitized check diagnostics
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # All attempts of this run allow a reporting-only retry to reuse checks.
          pattern: ci-checks-*-${{ github.run_id }}-*
          path: .ci-reports/downloads

      - name: Prepare complete sanitized report
        run: node scripts/ci/report.js
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}

      # Persist the full prepared report before any Google authentication/write.
      - name: Save prepared report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/report/report.json
            .ci-reports/report/report.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Authenticate reporting service account through WIF
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_REPORT_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/documents
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Replace and verify Google document report
        run: node scripts/ci/googleDocReport.js
        env:
          GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}

      - name: Save delivery outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/delivery/status.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
