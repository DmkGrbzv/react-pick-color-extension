name: Prepare staging delivery

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full master commit SHA with successful application checks and GHCR publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare verified staging release (no server deployment)
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    permissions:
      contents: read
      actions: read
      packages: read
    concurrency:
      group: staging-delivery
      cancel-in-progress: false
    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Verify application checks and resolve the published digest
        run: node scripts/ci/prepareStaging.js
        env:
          STAGING_COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save portable release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-release-${{ inputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/staging/release.json
            .ci-reports/staging/release.env
            backend/deploy/compose.yaml
            backend/deploy/deploy.js
            backend/deploy/imageReference.js
            backend/deploy/.env.example
            backend/deploy/nginx/
            docs/ec2-staging.md
          include-hidden-files: true
          retention-days: 7
